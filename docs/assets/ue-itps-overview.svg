<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">UE ITPS architecture overview</title>
  <desc id="desc">Unreal Engine project inputs flow through read-only analyzers into structured evidence and local inspection tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7dd3fc" />
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#background)" />
  <circle cx="1080" cy="80" r="180" fill="#2563eb" opacity="0.12" />
  <circle cx="130" cy="560" r="210" fill="#7c3aed" opacity="0.12" />

  <text x="70" y="92" fill="#f8fafc" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="48" font-weight="700">UE ITPS</text>
  <text x="72" y="132" fill="#bae6fd" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="20">只读分析 Unreal Engine 工程，保留证据和边界</text>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="235" height="220" rx="20" fill="#111c33" stroke="#334155" />
    <rect x="335" y="210" width="235" height="220" rx="20" fill="#111c33" stroke="#334155" />
    <rect x="630" y="210" width="235" height="220" rx="20" fill="#111c33" stroke="#334155" />
    <rect x="925" y="210" width="205" height="220" rx="20" fill="#111c33" stroke="#334155" />
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)">
    <path d="M305 320H325" />
    <path d="M570 320H620" />
    <path d="M865 320H915" />
  </g>

  <g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif">
    <text x="98" y="260" fill="#7dd3fc" font-size="17" font-weight="700">INPUTS</text>
    <text x="98" y="302" fill="#f8fafc" font-size="24" font-weight="700">工程材料</text>
    <text x="98" y="340" fill="#cbd5e1" font-size="17">.uproject / .uplugin</text>
    <text x="98" y="370" fill="#cbd5e1" font-size="17">Build.cs / Target.cs</text>
    <text x="98" y="400" fill="#cbd5e1" font-size="17">C++ / C# / 配置</text>

    <text x="363" y="260" fill="#a78bfa" font-size="17" font-weight="700">ANALYZE</text>
    <text x="363" y="302" fill="#f8fafc" font-size="24" font-weight="700">只读工具</text>
    <text x="363" y="340" fill="#cbd5e1" font-size="17">sourcetools</text>
    <text x="363" y="370" fill="#cbd5e1" font-size="17">edittools</text>
    <text x="363" y="400" fill="#cbd5e1" font-size="17">Tree-sitter 前端</text>

    <text x="658" y="260" fill="#67e8f9" font-size="17" font-weight="700">EVIDENCE</text>
    <text x="658" y="302" fill="#f8fafc" font-size="24" font-weight="700">结构化结果</text>
    <text x="658" y="340" fill="#cbd5e1" font-size="17">JSON + Schema</text>
    <text x="658" y="370" fill="#cbd5e1" font-size="17">validation + limits</text>
    <text x="658" y="400" fill="#cbd5e1" font-size="17">文件图谱 / 知识图谱</text>

    <text x="950" y="260" fill="#86efac" font-size="17" font-weight="700">INSPECT</text>
    <text x="950" y="302" fill="#f8fafc" font-size="24" font-weight="700">继续定位</text>
    <text x="950" y="340" fill="#cbd5e1" font-size="17">本地浏览器</text>
    <text x="950" y="370" fill="#cbd5e1" font-size="17">Agent / 脚本</text>
    <text x="950" y="400" fill="#cbd5e1" font-size="17">人工复核</text>
  </g>

  <rect x="70" y="500" width="1060" height="2" fill="url(#accent)" opacity="0.8" />
  <text x="70" y="550" fill="#e2e8f0" font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif" font-size="18">工具输出可追溯、可校验，并明确声明解析边界。</text>
</svg>
